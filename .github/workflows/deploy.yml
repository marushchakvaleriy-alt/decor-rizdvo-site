name: Deploy to GitHub Pages

on:
  # Запускає деплой при пуші в гілку main
  push:
    branches: ["main"]
  
  # Дозволяє запускати деплой вручну з вкладки Actions
  workflow_dispatch:

# Встановлюємо права, необхідні для деплою на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Запобігаємо одночасному запуску кількох деплоїв
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Вказуємо шлях до вашої папки зі статичним сайтом
          path: './public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
